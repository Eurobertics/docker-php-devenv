name: Build and Push Multiarch Docker Images

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Multiarch Images
        run: |
          set -e
          IMAGE_NAME="eurobertics/php-devenv"
          EXCLUDE_DIRS=("74-apache24" "74-cli" "81-apache24" "81-cli" "82-apache24" "82-cli" "83-apache24" "83-cli" "84-apache24" "85-cli" "85-apache24")
          PLATFORMS="linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6"

          for dir in */; do
            TAG="${dir%/}"
            DOCKERFILE="$dir/Dockerfile"

            # Prüfen, ob das Verzeichnis auf der Blacklist ist
            if [[ " ${EXCLUDE_DIRS[@]} " =~ " $TAG " ]]; then
              echo "Skipping $TAG (excluded from build)"
              continue
            fi

            if [ -f "$DOCKERFILE" ]; then
              echo "Building and pushing multiarch image for $TAG"
              
              # Build für beide Registries mit einem Befehl
              docker buildx build \
                --platform $PLATFORMS \
                --push \
                --cache-from type=registry,ref=ghcr.io/$IMAGE_NAME:$TAG-buildcache \
                --cache-to type=registry,ref=ghcr.io/$IMAGE_NAME:$TAG-buildcache,mode=max \
                -t ghcr.io/$IMAGE_NAME:$TAG \
                -t $IMAGE_NAME:$TAG \
                -f $DOCKERFILE $dir
              
              echo "✓ Successfully built and pushed $TAG"
            else
              echo "No Dockerfile found in $dir, skipping..."
            fi
          done
          
          echo "All multiarch images built and pushed successfully!"
